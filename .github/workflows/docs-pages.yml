name: Publish documentation

on:
  push:
    branches:
      - main
      - codex/alb-0.4.5
    paths:
      - ALB/**
      - docs/**
      - tools/docs/**
      - .github/workflows/docs-pages.yml
      - mkdocs.yml
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out ALB source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: python -m pip install ".[docs,test,film,control]"

      - name: Check generated references
        run: |
          python tools/docs/generate_public_api_reference.py --check
          python tools/docs/generate_bearing_config_reference.py --check
          python tools/docs/generate_simulation_config_reference.py --check
          python tools/docs/generate_namespace_reference.py --check

      - name: Test documentation contracts
        run: >-
          python -m pytest
          tests/unit/docs
          tests/unit/api/test_public_api_reference.py
          tests/unit/api/test_bearing_config_reference.py
          tests/unit/api/test_simulation_config_reference.py
          tests/integration/api/test_documented_examples.py
          tests/integration/docs
          -q

      - name: Build public documentation
        run: python -m mkdocs build --strict

      - name: Check out public Pages repository
        uses: actions/checkout@v6
        with:
          repository: waj734014160-creator/waj734014160-creator.github.io
          ref: main
          path: pages-site
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}

      - name: Stage ALB site under the project path
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("site").resolve()
          repository = Path("pages-site").resolve()
          target = (repository / "ALB").resolve()
          if target.parent != repository:
              raise RuntimeError("Refusing to replace a path outside the Pages repository")
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source, target)
          (repository / ".nojekyll").touch()
          PY

      - name: Publish generated site
        working-directory: pages-site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all ALB .nojekyll
          if git diff --cached --quiet; then
            echo "The published documentation is already current."
            exit 0
          fi
          git commit -m "docs: deploy ALB from ${SOURCE_SHA}"
          git push origin HEAD:main
