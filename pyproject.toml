[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re-alb"
version = "0.4.3"
description = "Active lubricated bearing physics, control, dynamics, and surrogate models"
requires-python = ">=3.10"
dependencies = [
    "json5>=0.9",
    "numba>=0.58",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.optional-dependencies]
film = [
    "matplotlib>=3.7",
    "scikit-fem>=11",
]
control = [
    "control>=0.10",
    "matplotlib>=3.7",
    "scikit-fuzzy>=0.4",
]
dynamics = [
    "matplotlib>=3.7",
    "ross-rotordynamics>=1.4",
]
surrogate = [
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "torch>=2.1",
]
all = [
    "control>=0.10",
    "matplotlib>=3.7",
    "ross-rotordynamics>=1.4",
    "scikit-fem>=11",
    "scikit-fuzzy>=0.4",
    "scikit-learn>=1.3",
    "torch>=2.1",
]
test = [
    "build>=1.2",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=9",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "pymdown-extensions>=10.14,<11",
]

[tool.setuptools.packages.find]
include = ["ALB", "ALB.*"]

[tool.setuptools.package-data]
"ALB.systems.alb" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "ALB/contracts",
    "ALB/core",
    "ALB/api",
    "ALB/control/blocks.py",
    "ALB/dynamics/rotor_layout.py",
    "ALB/dynamics/rotor_results.py",
    "ALB/dynamics/coupling_runtime.py",
    "ALB/dynamics/bindings.py",
    "ALB/infrastructure/recording.py",
    "ALB/systems/alb/_harmonic_runtime.py",
    "ALB/systems/alb/harmonic_coefficients.py",
    "ALB/systems/alb/harmonic_results.py",
    "ALB/systems/alb/scales.py",
    "ALB/surrogate/package.py",
    "ALB/surrogate/scaler_io.py",
    "ALB/surrogate/runtime.py",
    "ALB/physics/gas/runtime.py",
    "tools/validation/release_phases.py",
    "tools/validation/release_source_identity.py",
    "tools/validation/run_resource_acceptance_0_4.py",
    "tools/validation/run_release_acceptance_0_4.py",
    "tools/validation/run_release_acceptance_0_4_1.py",
    "tools/validation/run_release_acceptance_0_4_2.py",
]
exclude = ["ALB/core/fem", "ALB/core/numerics"]
